openapi: 3.1.0
info:
  title: Contract Ops API
  version: 0.1.0
  description: >
    A deterministic event feed for the Contract Ops frontend. The process starts
    with four fixtures and appends up to four more live demo events over SSE.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Check API availability
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Check that the database is reachable and migrations match this binary
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Not ready
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /v1/events:
    get:
      summary: List service events
      parameters:
        - name: q
          in: query
          description: Case-insensitive match against event ID, source, type, or correlation ID.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [processed, pending, failed, all]
        - name: cursor
          in: query
          description: Opaque keyset from a previous page. Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. Defaults to 50. Maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: connection_id
          in: query
          description: Restrict the feed to one connection. Empty for the demo fixtures.
          schema:
            type: string
      responses:
        "200":
          description: Matching events ordered newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/events/stream:
    get:
      summary: Stream filtered service events
      description: >
        Server-Sent Events stream. Sends an EventPage snapshot on connect and
        again whenever the stored feed changes. Uses the same filters as
        GET /v1/events.
      parameters:
        - name: q
          in: query
          description: Case-insensitive match against event ID, source, type, or correlation ID.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [processed, pending, failed, all]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: connection_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of EventPage JSON payloads.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"events":[],"total":0}
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Event:
      type: object
      required: [id, source, type, status, occurredAt, correlationId]
      properties:
        id:
          type: string
          example: evt_01HV1B03
        source:
          type: string
          example: onramp-webhook
        type:
          type: string
          example: purchase.failed
        status:
          type: string
          enum: [processed, pending, failed]
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          example: crl_onramp_62de
    EventPage:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer
          minimum: 0
          description: Matching events, not just the current page.
        nextCursor:
          type: string
          description: Present when another page is available.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details. code matches the shared error catalog when the failure is a known one.
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        retryable:
          type: boolean
        action:
          type: string
