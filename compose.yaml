services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contract_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract_ops}
      POSTGRES_DB: ${POSTGRES_DB:-contract_ops}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./api
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://contract_ops:contract_ops@postgres:5432/contract_ops?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
      SHUTDOWN_TIMEOUT: 5s
      DEMO_GENERATOR: "true"
      DATABASE_URL: postgres://contract_ops:contract_ops@postgres:5432/contract_ops?sslmode=disable
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-co_local_dev_key_not_for_production}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
