name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contract_ops
          POSTGRES_PASSWORD: contract_ops
          POSTGRES_DB: contract_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract_ops -d contract_ops"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://contract_ops:contract_ops@localhost:5432/contract_ops?sslmode=disable
      BOOTSTRAP_API_KEY: co_local_dev_key_not_for_production
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ORIGIN: http://localhost:13000
      DEMO_GENERATOR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
      - run: chmod +x scripts/run-e2e.sh && npm run test:e2e

  web-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contract_ops
          POSTGRES_PASSWORD: contract_ops
          POSTGRES_DB: contract_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract_ops -d contract_ops"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://contract_ops:contract_ops@localhost:5432/contract_ops?sslmode=disable
      TEST_DATABASE_URL: postgres://contract_ops:contract_ops@localhost:5432/contract_ops?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go run ./cmd/gencatalog -check
      - run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen --config oapi-codegen.yaml ../openapi.yaml
      - run: git diff --exit-code -- internal/platform/apigen/types.gen.go
      - run: go run ./cmd/migrate
      - run: go run ./cmd/migrate down
      - run: go run ./cmd/migrate down
      - run: go run ./cmd/migrate
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.13.2
          install-only: true
      - run: golangci-lint run ./...
      - run: golangci-lint fmt --diff
